version: "2"
sql:
  - engine: "sqlite"
    schema: "db/schema"
    queries: "db/query/"
    gen:
      go:
        package: "sqlc"
        out: "internal/gen/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
