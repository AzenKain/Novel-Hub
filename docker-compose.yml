services:
  novelhub:
    image: azenkain/novel-hub:latest
    container_name: novelhub
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_HOST: ${SERVER_HOST:-127.0.0.1}
      SERVER_PORT: ${SERVER_PORT:-3434}
      FRONTEND_URL: ${FRONTEND_URL:-http://your-domain.com}
      DATA_DIR: /data
      SQLITE_DB_PATH: /data/novelhub.db
      SQLITE_CACHE_SIZE_KB: ${SQLITE_CACHE_SIZE_KB:-262144}
      SQLITE_MMAP_SIZE_BYTES: ${SQLITE_MMAP_SIZE_BYTES:-536870912}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
      TOKEN_VERSION_CACHE: ${TOKEN_VERSION_CACHE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      DISABLE_RESPONSE_COMPRESSION: ${DISABLE_RESPONSE_COMPRESSION:-false}
      ENABLE_PREFORK: ${ENABLE_PREFORK:-false}
      DISABLE_STARTUP_MESSAGE: ${DISABLE_STARTUP_MESSAGE:-false}
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-10}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}
      RESTORE_AUTO_RESTART: ${RESTORE_AUTO_RESTART:-true}

    ports:
      - "${SERVER_PORT:-3434}:${SERVER_PORT:-3434}"
    volumes:
      - novelhub_data:/data

volumes:
  novelhub_data:
